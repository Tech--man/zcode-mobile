name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 签名材料从 secrets 还原（jks 本身不入库）
      - name: Restore signing materials
        run: |
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk "ZCode-${GITHUB_REF_NAME}-release.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ZCode-${GITHUB_REF_NAME}-release.apk" --title "$GITHUB_REF_NAME" --generate-notes
